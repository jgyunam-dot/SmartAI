<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart AI - 앱 다운로드</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Slate 50 */
            color: #0f172a; /* Slate 900 */
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>

<body class="relative min-h-screen overflow-hidden flex items-center justify-center selection:bg-red-500 selection:text-white">

    <div class="absolute w-full h-full inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-0 -left-4 w-72 h-72 bg-red-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>
        <div class="absolute top-0 -right-4 w-72 h-72 bg-slate-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-4000"></div>
    </div>

    <main class="relative z-10 w-full max-w-md px-6 py-12 mx-auto flex flex-col items-center text-center">
        
        <!-- White Card Wrapper -->
        <div class="bg-white/80 backdrop-blur-xl w-full rounded-[2.5rem] p-8 sm:p-10 shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-slate-100 flex flex-col items-center transform transition-all hover:scale-[1.01] duration-500">
            
            <div class="w-24 h-24 mb-6 rounded-3xl bg-slate-50 flex items-center justify-center shadow-inner border border-slate-100">
                <svg viewBox="0 0 24 24" fill="none" class="w-14 h-14" xmlns="http://www.w3.org/2000/svg">
                    <!-- Black Square Outline -->
                    <path d="M11 4H6C4.89543 4 4 4.89543 4 6V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V13" 
                          stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- Red Pencil -->
                    <path d="M18.5 2.5C19.3284 1.67157 20.6716 1.67157 21.5 2.5C22.3284 3.32843 22.3284 4.67157 21.5 5.5L10 17L6 18L7 14L18.5 2.5Z" 
                          stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <span class="px-3 py-1 text-xs font-semibold tracking-wider text-red-700 bg-red-50 rounded-full border border-red-100 mb-4">
                정식버전 V1.0
            </span>
            
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight mb-3 text-slate-900">
                Smart AI
            </h1>
            
            <p class="text-slate-600 text-sm sm:text-base leading-relaxed mb-8 max-w-[280px]">
                <strong class="text-slate-900 block mb-1 text-lg">스마트 학습 시스템</strong>
                모바일 기기에서 차세대 인공지능을 경험해보세요. 빠르고 똑똑하며 완벽하게 직관적입니다.
            </p>

            <a href="https://github.com/jgyunam-dot/SmartAI/releases/download/SmartAI/SmartAI.apk" 
               class="group relative inline-flex items-center justify-center w-full px-8 py-4 text-lg font-bold text-white transition-all duration-300 bg-slate-900 rounded-2xl hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 shadow-lg hover:shadow-xl">
                
                <span class="mr-2">APK 다운로드</span>
                
                <!-- Download Arrow Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 transition-transform group-hover:-translate-y-1 group-hover:animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
            </a>
            
            <div class="mt-4 flex items-center justify-center space-x-2 text-xs text-slate-500 font-medium">
                <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>공식 안전 다운로드</span>
            </div>
            
            <p class="mt-6 text-xs text-slate-400 max-w-[250px] break-keep">
                다운로드 시 이용약관 및 개인정보 처리방침에 동의하는 것으로 간주됩니다.<br>법인폰 기기와 호환됩니다.
            </p>
        </div>
    </main>

</body>
</html>
